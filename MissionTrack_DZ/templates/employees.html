{% extends 'base.html' %}
{% block content %}
<h2 class="text-3xl font-bold mb-6 text-slate-800">إدارة الموظفين</h2>

<!-- Add Form -->
<div class="bg-white p-6 rounded-lg shadow mb-8">
    <h3 class="text-xl font-bold mb-4">إضافة موظف جديد</h3>
    <form method="POST" action="{{ url_for('employees') }}" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="hidden" name="action" value="add">

        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">الاسم واللقب</label>
            <input type="text" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" required>
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">الرتبة</label>
            <input type="text" name="rank" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">الوظيفة</label>
            <input type="text" name="job" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">الرقم الاستدلالي</label>
            <input type="text" name="index" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">الصنف</label>
            <input type="text" name="category" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">المقر الإداري</label>
            <input type="text" name="workplace" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">طبيعة الحساب</label>
            <select name="bank_type" class="shadow border rounded w-full py-2 px-3 text-gray-700 bg-white focus:outline-none focus:shadow-outline">
                <option>CCP</option><option>BNA</option><option>BEA</option><option>CPA</option><option>BADR</option>
            </select>
        </div>
        <div>
            <label class="block text-gray-700 text-sm font-bold mb-2">رقم الحساب</label>
            <input type="text" name="bank_account" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
        </div>
        <div class="col-span-1 md:col-span-2 text-center mt-4">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-8 rounded focus:outline-none focus:shadow-outline">
                حفظ الموظف
            </button>
        </div>
    </form>
</div>

<!-- Table -->
<div class="bg-white rounded-lg shadow overflow-x-auto">
    <table class="min-w-full leading-normal">
        <thead>
            <tr>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">الرقم</th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">الاسم واللقب</th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">الرتبة</th>
                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-100 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider">إجراء</th>
            </tr>
        </thead>
        <tbody>
            {% for emp in employees %}
            <tr>
                <td class="px-5 py-5 border-b border-gray-200 text-sm">{{ emp[0] }}</td>
                <td class="px-5 py-5 border-b border-gray-200 text-sm font-bold">{{ emp[1] }}</td>
                <td class="px-5 py-5 border-b border-gray-200 text-sm">{{ emp[2] }}</td>
                <td class="px-5 py-5 border-b border-gray-200 text-sm">
                    <form method="POST" action="{{ url_for('employees') }}" onsubmit="return confirm('هل أنت متأكد من الحذف؟');">
                        <input type="hidden" name="action" value="delete">
                        <input type="hidden" name="emp_id" value="{{ emp[0] }}">
                        <button type="submit" class="text-red-600 hover:text-red-900 font-bold">حذف</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
