<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MissionTrack DZ - نافذتي للتنقل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="text-gray-800">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-800 text-white flex flex-col hidden md:flex">
            <div class="p-6 text-center text-2xl font-bold border-b border-slate-700">
                MissionTrack DZ
            </div>
            <nav class="flex-1 px-4 py-6 space-y-4">
                <a href="{{ url_for('dashboard') }}" class="block px-4 py-2 rounded hover:bg-slate-700 transition">لوحة القيادة</a>
                <a href="{{ url_for('employees') }}" class="block px-4 py-2 rounded hover:bg-slate-700 transition">إدارة الموظفين</a>
                <a href="{{ url_for('missions') }}" class="block px-4 py-2 rounded hover:bg-slate-700 transition">المهمات والكشوفات</a>
            </nav>
            <div class="p-4 text-center text-sm text-slate-400 border-t border-slate-700">
                تطوير: السيد مصباح مراد<br>قطاع المواصلات
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            <header class="bg-white shadow p-4 md:hidden">
                <h1 class="text-xl font-bold">MissionTrack DZ</h1>
            </header>
            <div class="p-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
